<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">EmbedDebug interface preview</title>
  <desc id="desc">A schematic preview of the EmbedDebug desktop workbench with navigation, Serial Station, signal analysis, logs, and diagnostics.</desc>
  <rect width="1280" height="640" rx="24" fill="#0F172A"/>
  <rect x="28" y="28" width="1224" height="584" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <rect x="28" y="28" width="1224" height="48" rx="18" fill="#1E293B"/>
  <circle cx="58" cy="52" r="7" fill="#EF4444"/>
  <circle cx="82" cy="52" r="7" fill="#F59E0B"/>
  <circle cx="106" cy="52" r="7" fill="#22C55E"/>
  <text x="140" y="58" fill="#E5E7EB" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">EmbedDebug Workbench</text>
  <text x="1080" y="58" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">Serial / Protocol / Waveform / OTA</text>

  <rect x="52" y="100" width="210" height="480" rx="12" fill="#0B1220" stroke="#1F2937"/>
  <text x="76" y="134" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Navigation</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14">
    <rect x="72" y="158" width="150" height="30" rx="8" fill="#2563EB"/>
    <text x="96" y="178" fill="#FFFFFF">Serial Station</text>
    <text x="96" y="222" fill="#CBD5E1">Protocol Lab</text>
    <text x="96" y="266" fill="#CBD5E1">Waveform</text>
    <text x="96" y="310" fill="#CBD5E1">OTA</text>
    <text x="96" y="354" fill="#CBD5E1">Dashboard</text>
    <text x="96" y="398" fill="#CBD5E1">Automation</text>
  </g>
  <rect x="72" y="514" width="146" height="34" rx="8" fill="#172554" stroke="#2563EB"/>
  <text x="92" y="536" fill="#BFDBFE" font-family="Segoe UI, Arial, sans-serif" font-size="13">Doctor: ready</text>

  <rect x="286" y="100" width="520" height="480" rx="12" fill="#F8FAFC"/>
  <text x="316" y="138" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Serial Station</text>
  <rect x="316" y="160" width="450" height="62" rx="10" fill="#E2E8F0"/>
  <text x="340" y="186" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Port configuration</text>
  <text x="340" y="207" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13">COM, baud, parity, data bits, stop bits</text>
  <rect x="316" y="244" width="450" height="90" rx="10" fill="#DBEAFE"/>
  <text x="340" y="272" fill="#1E3A8A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Protocol registry</text>
  <text x="340" y="296" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="13">ascii_text / modbus_rtu / custom_md</text>
  <rect x="340" y="310" width="98" height="10" rx="5" fill="#60A5FA"/>
  <rect x="448" y="310" width="90" height="10" rx="5" fill="#38BDF8"/>
  <rect x="548" y="310" width="100" height="10" rx="5" fill="#14B8A6"/>
  <rect x="316" y="356" width="450" height="150" rx="10" fill="#0F172A"/>
  <text x="340" y="386" fill="#E2E8F0" font-family="Consolas, monospace" font-size="14">TX 01 03 00 00 00 02 C4 0B</text>
  <text x="340" y="416" fill="#7DD3FC" font-family="Consolas, monospace" font-size="14">RX modbus_frame slave=1 fc=3 bytes=4</text>
  <text x="340" y="446" fill="#A7F3D0" font-family="Consolas, monospace" font-size="14">RX custom_md cmd=0x10 payload=01 02</text>
  <text x="340" y="476" fill="#FDE68A" font-family="Consolas, monospace" font-size="14">LOG session opened, dispatcher active</text>
  <rect x="316" y="526" width="450" height="28" rx="8" fill="#DCFCE7"/>
  <text x="340" y="545" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="13">Status: connected workflow, tested launch path</text>

  <rect x="830" y="100" width="390" height="224" rx="12" fill="#0B1220" stroke="#1F2937"/>
  <text x="858" y="136" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Signal Analysis</text>
  <polyline points="860,260 900,230 940,250 980,180 1020,210 1060,150 1100,190 1140,164 1180,205" fill="none" stroke="#38BDF8" stroke-width="4"/>
  <polyline points="860,280 900,270 940,275 980,250 1020,258 1060,238 1100,246 1140,232 1180,240" fill="none" stroke="#A3E635" stroke-width="3"/>
  <line x1="858" y1="288" x2="1190" y2="288" stroke="#334155"/>
  <line x1="858" y1="158" x2="858" y2="288" stroke="#334155"/>

  <rect x="830" y="348" width="390" height="232" rx="12" fill="#F8FAFC"/>
  <text x="858" y="386" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Engineering Diagnostics</text>
  <rect x="858" y="410" width="322" height="30" rx="8" fill="#E0F2FE"/>
  <text x="876" y="430" fill="#075985" font-family="Segoe UI, Arial, sans-serif" font-size="13">Doctor: environment and launch checks</text>
  <rect x="858" y="454" width="322" height="30" rx="8" fill="#ECFDF5"/>
  <text x="876" y="474" fill="#047857" font-family="Segoe UI, Arial, sans-serif" font-size="13">GO loop: execute - check - fix</text>
  <rect x="858" y="498" width="322" height="30" rx="8" fill="#FEF3C7"/>
  <text x="876" y="518" fill="#92400E" font-family="Segoe UI, Arial, sans-serif" font-size="13">BATCH: reviewed parallel tasks</text>
  <rect x="858" y="542" width="322" height="18" rx="9" fill="#CBD5E1"/>
  <rect x="858" y="542" width="238" height="18" rx="9" fill="#2563EB"/>
</svg>
