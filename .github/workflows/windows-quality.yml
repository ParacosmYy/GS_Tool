name: SerialForge Windows quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        shell: pwsh
        run: python -m pip install --upgrade uv
      - name: Locked sync and static checks
        shell: pwsh
        run: .\scripts\check.ps1

  package:
    needs: quality
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [core, ble]
        mode: [onedir, onefile]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        shell: pwsh
        run: python -m pip install --upgrade uv
      - name: Build isolated package
        shell: pwsh
        run: |
          if ("${{ matrix.variant }}" -eq "ble") {
            .\scripts\package.ps1 -Mode "${{ matrix.mode }}" -Ble
          }
          else {
            .\scripts\package.ps1 -Mode "${{ matrix.mode }}"
          }
      - name: Verify provenance manifest
        shell: pwsh
        run: |
          $manifests = @(Get-ChildItem -Path dist/release -Filter PROVENANCE.json -Recurse -File)
          if ($manifests.Count -ne 1) {
            throw "Expected exactly one matrix manifest, found $($manifests.Count)."
          }
          uv run --locked --extra dev python scripts/provenance.py verify --manifest $manifests[0].FullName
      - name: Upload isolated artifact
        uses: actions/upload-artifact@v4
        with:
          name: SerialForge-windows-${{ matrix.variant }}-${{ matrix.mode }}
          path: dist/release
