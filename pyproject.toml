[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embeddebug-tools"
version = "0.1.0"
description = "Local development and packaging tools for EmbedDebug."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
package-embeddebug = "tools.package_embeddebug:main"
start-embeddebug = "tools.start_embeddebug:main"
test-embeddebug-tools = "tools.test_embeddebug_tools:main"
verify-package-embeddebug = "tools.verify_package_embeddebug:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["tools*"]
