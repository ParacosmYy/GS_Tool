[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embeddebug-tools"
version = "0.1.0"
description = "Local development tools and Python/PyQt migration lane for EmbedDebug."
requires-python = ">=3.10"
dependencies = [
    "numpy>=2,<3",
    "PyQt6>=6.8,<7",
    "pyqtgraph>=0.13,<0.15",
]

[project.scripts]
package-embeddebug = "embeddebug.devtools.package_pyinstaller:main"
start-embeddebug = "embeddebug.app.main:main"
start-embeddebug-py = "embeddebug.app.main:main"
package-embeddebug-py = "embeddebug.devtools.package_pyinstaller:main"
test-embeddebug-py = "embeddebug.devtools.test:main"
test-embeddebug-tools = "tools.test_embeddebug_tools:main"
verify-package-embeddebug = "embeddebug.devtools.verify_pyinstaller_package:main"
verify-package-embeddebug-py = "embeddebug.devtools.verify_pyinstaller_package:main"
lint-embeddebug-py = "embeddebug.devtools.lint:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-qt>=4.4,<5",
    "ruff>=0.6,<1",
]
packaging = [
    "pyinstaller>=6,<7",
    "pyinstaller-hooks-contrib>=2024.0",
]

[tool.uv]
package = true
default-groups = ["dev", "packaging"]

[tool.setuptools.packages.find]
where = [".", "python"]
include = ["tools*", "embeddebug*"]

# Batch 50-5: ruff 静态检查配置（机械捕获未使用 import / 变量 / 死代码）。
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "resources/themes",
]

[tool.ruff.lint]
# Batch 56-60: F + UP + B + SIM 系列全强制（死代码 + 现代化 + bugbear + 简化）。
select = [
    "F",     # Pyflakes
    "UP",    # pyupgrade
    "B",     # bugbear
    "SIM",   # flake8-simplify
]
# SIM105（contextlib.suppress）：40 处防御性代码，try/except 更直观。
# SIM102（嵌套 if 合并）：有时降低可读性，保留显式嵌套。
# SIM115（context manager for files）：改变资源管理语义，需逐个审查。
ignore = ["SIM105", "SIM102", "SIM115"]

[tool.ruff.lint.per-file-ignores]
# __init__.py 的 re-export 是设计内（公共 API），不算未使用 import。
"**/__init__.py" = ["F401"]

# Batch 50-6: pytest 严格化配置（testpaths + strict-markers）。
[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = ["-ra", "--strict-markers"]
