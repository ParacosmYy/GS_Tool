[project]
name = "serialforge"
dynamic = ["version"]
description = "A Windows-first embedded debug console."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.9,<7",
    "pyserial>=3.5,<4",
]

[project.optional-dependencies]
ble = [
    "bleak>=0.22,<4",
]
dev = [
    "pyinstaller>=6,<7",
    "ruff>=0.14,<1",
]

[project.scripts]
serialforge = "serialforge.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serialforge"]

[tool.hatch.version]
path = "src/serialforge/__init__.py"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
